  id: Long ID
  reference: String REF
  numero: String LABEL

  # Champ 1 - Periode de declaration (10) [O]
  periode: String REQ


  # Champ 2 - Code Employeur (7) [O]
  codeEmployeur: String REQ

  # Champ 3 - Intitule Employeur (10) [O]
  intituleEmployeur: String REQ

  # Champ 4 - Matricule CNSS de l'assuré (10) [N]
  matriculeCnss: String
  # Champ 5 - IDENTIFIANT_EMPLOYEUR / matricule interne (12) [O]
  identifiantEmployeur: String REQ
  # Champ 6 - NOM (30) [O]
  nom: String REQ
  # Champ 7 - PRENOM (30) [O]
  prenom: String REQ
  # Champ 8 - CINE /SEJ (13) [O]
  cine: String REQ
  sej: String REQ

  # Champ 9 - DATE_NAISSANCE (10) jj/mm/yyyy [O]
  dateNaissance: LocalDate REQ

  # Champ 10 - ASSIETTE mensuelle de la cotisation (10) [N]
  assiette: BigDecimal

  # Champ 11 - CONTRIBUTIONS_PATRONALES (7) [N]
  contributionsPatronales: BigDecimal

  # Champ 12 - COTISATIONS_SALARIALES (7) [N]
  cotisationsSalariales: BigDecimal

  # Champ 13 - COTISATIONS AMO (Total) (10) [N]
  cotisationsAmo: BigDecimal

  # Champ 14 - MONTANT_REGULARISATION (11) - peut être négatif [N]
  montantRegularisation: BigDecimal

  # Champ 15 - DEBUT_EFFECT_REGULARISATION (10) jj/mm/yyyy [N, obligatoire si montantRegularisation renseigné]
  debutEffectRegularisation: LocalDate

  # Champ 16 - FIN_EFFECT_REGULARISATION (10) jj/mm/yyyy [N, obligatoire si montantRegularisation renseigné]
  finEffectRegularisation: LocalDate

  # Champ 17 - DATE_RECRUTEMENT (10) jj/mm/yyyy [O pour les nouvelles recrues]
  dateRecrutement: LocalDate REQ

  # Champ 18 - N° Affilié (7) [N]
  numeroAffilie: String

  # Champ 19 - Statut de l'agent (30) [N]  motif de cessation : Démission, Décès, Mise en disponibilité...
  statutAgentDeclarationCotisation: StatutAgentDeclarationCotisation

  # Champ 21 - Date d'effet du statut de l'agent (10) JIMMYYYY  [O si le motif de cessation est renseigné]
  dateEffetStatutAgent: LocalDate

