OrderBoutique_MS(ms1)_ROLES(admin)_EXPORT_IMPORTABLE_SUB-MODULE(order)_MENU(Purchase Management,pi pi-fw pi-pencil)_ICON(pi pi-check):
    id: Long ID
    boutique: Boutique
    orderBoutiqueItems: OrderBoutiqueItem List
    code: String REF_REQ
    reference: String LABEL_REQ
    description: String LARGE
    dateOrder: LocalDateTime
    quantite: BigDecimal
    totalNonCompliance: BigDecimal
    montantTotal: BigDecimal
    produitCatalog: ProduitCatalog
    buyingFrame: String
    orderBoutiques: OrderBoutique List
